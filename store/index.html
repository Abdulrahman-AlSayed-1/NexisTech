    <!-- Tab Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta
      name="twitter:description"
      content="Shop top-tier laptops, smartphones, high-fidelity audio, gaming gear, and tech accessories at Nexis Tech. Guaranteed authentic hardware with swift delivery."
